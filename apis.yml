name: Conta Azul
description: >-
  Conta Azul is a Brazilian financial-management and ERP platform for small and
  medium-sized businesses, providing cash-flow control, bank reconciliation,
  electronic invoicing (NF-e/NFS-e/NFC-e), sales and customer management,
  automatic collections, inventory, supplier management and recurring contracts.
  Its developer platform exposes REST/JSON APIs (api-v2.contaazul.com) secured
  with OAuth 2.0 (AWS Cognito, Authorization Code flow) covering Financeiro,
  Cobranças, Baixas, Vendas, Pessoas/Fornecedores, Produtos e Serviços, Notas
  Fiscais and Contratos, so partner systems (BI, CRM, e-commerce) can integrate
  with the ERP. Surfaced to the API Evangelist network from a 500 Global
  portfolio stub (originally mislabeled "DVPJ") and enriched here.
